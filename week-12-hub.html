<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 12 &middot; BIO 004 Human Anatomy</title>
<style>html,body{margin:0;background:#08101F;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}main{padding:40px 20px}a{color:#E3C27D;font-weight:700}</style>
<script>
/* Week 12 reads the newest calendar (schedule-alt-fall2026.js) through
   bio004-week.html, the same data as the class day plan and the pre-read,
   so the three can never disagree. Keeps ?sec= and breaks out of a Canvas
   or Kajabi frame so the page is never nested. */
(function () {
  var q = location.search.replace(/^\?/, '');
  q = q.replace(/(^|&)(w|hub)=\d+/g, '').replace(/^&/, '');
  var url = 'bio004-week.html?w=12' + (q ? '&' + q : '') + location.hash;
  try {
    if (window.top === window.self) location.replace(url);
    else window.top.location.replace(new URL(url, location.href).href);
  } catch (e) { location.replace(url); }
})();
</script>
</head>
<body>
<main><p>Opening week 12. <a href="bio004-week.html?w=12" target="_top">Open it here</a> if nothing happens.</p></main>
</body>
