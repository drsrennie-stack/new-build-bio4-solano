<!-- ============================================================
     BIO 004 Human Anatomy, Fall 2026
     virtual-office-canvas-embed.html

     PASTE-INTO-CANVAS SNIPPET FOR virtual-office.html

     This file is not a page. It is the block of HTML to paste into a
     Canvas page, and it is kept in the repo so there is one copy of it
     rather than one per person who needs it.

     HOW TO USE IT
       1. In Canvas, open the page you want this on and click Edit.
       2. Switch the editor to HTML: the </> button at the bottom right
          of the editor toolbar.
       3. Copy ONE of the two blocks below, everything between the
          BEGIN and END comment lines, and paste it in.
       4. Save.

     WHICH BLOCK
       Block A is the default. The whole page shows, no inner
       scrollbar, the student scrolls the Canvas page as normal. This
       reads better on a phone, where a scrollbar inside a scrollbar is
       miserable.

       Block B is a fixed window with its own scrollbar. Use it only if
       you want the Canvas page itself to stay short.

     WHY THE HEIGHT IS WHAT IT IS
       Measured in a real browser. The page is 7,099px at a 980px
       column, 7,555px at 720px, and 9,672px at 500px, because narrow
       columns wrap more lines. Block A is set to 10,200px so the
       narrowest phone still fits with headroom. Extra height on a wide
       screen costs a little blank space at the foot of the frame and
       nothing else; too little height would cut the page off, which is
       worse.

     A NOTE ON CANVAS AND SCRIPTS
       Canvas strips <script> out of page HTML, so the height-sender
       baked into virtual-office.html cannot be received here and the
       frame cannot size itself. That is why the height is hard-coded.
       The sender is still in the page, so the same file resizes itself
       correctly if it is ever embedded somewhere that allows scripts,
       Kajabi for example.

     THE TITLE ATTRIBUTE IS NOT OPTIONAL
       An iframe with no accessible name is a WCAG 4.1.2 failure. A
       screen reader announces "frame" and nothing else. Keep it.
     ============================================================ -->


<!-- ===== BEGIN BLOCK A, full height, no inner scrollbar ===== -->
<p>
  <iframe
    src="https://drsrennie-stack.github.io/new-build-bio4-solano/virtual-office.html"
    title="The Virtual Office: how to use the course question board"
    width="100%"
    height="10200"
    style="width:100%;min-height:10200px;border:0;display:block;"
    loading="lazy"
    scrolling="no"
    allowfullscreen></iframe>
</p>
<p>
  <a href="https://drsrennie-stack.github.io/new-build-bio4-solano/virtual-office.html"
     target="_blank" rel="noopener">Open these instructions in their own tab</a>
  if the frame above does not load.
</p>
<!-- ===== END BLOCK A ===== -->
