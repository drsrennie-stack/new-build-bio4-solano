<!-- ============================================================
     BIO 004 Human Anatomy, Fall 2026, Solano Community College

     today.html  ::  the one screen that answers "what do I do now"

     WHY THIS PAGE EXISTS
     --------------------
     A student walking in from Canvas used to meet five screens
     before anything told them tonight's task, and those screens
     disagreed with each other. This page is the single answer.
     It reads the real date and the student's section and shows
     ONE thing to do, with the rest folded away until it is their
     turn. Nothing here is new content. Every link points at
     material that already exists in this repo.

     WHERE ITS FACTS COME FROM
     -------------------------
       schedule-fall2026.js   BIO004_SECTIONS  section identity,
                              meeting days, rooms, exam dates
                              BIO004_SESSIONS  every class day,
                              per track, with what happens in it
       session-links.js       BIO004_SESSION_LINKS, keyed by ISO
                              date: the sheet, the notes, the
                              video, the slides, the lab sprints

     Change a date or a link in those two files and this page
     follows. There is no schedule data in this file.

     THE SEQUENCE IT ENFORCES
     ------------------------
     Her order, and it is load-bearing:
       1. notes and reading open
       2. work the pre-work sheet against them
       3. THEN the video, as the check and not the source
       4. bring the written copy to class
       5. retrieval later in the week, not the same night

     ACCESSIBILITY
     -------------
     WCAG 2.2 AA floor, AAA on every text pair. Real buttons,
     aria-expanded on every disclosure, aria-current on the live
     step, a polite live region for step changes, focus ring
     #6B1616 at 11.5:1 on light and #DCB45C at 8.9:1 on navy, no
     state carried by colour alone (every step also says Done,
     Now, or Later in text), no timers, 44px targets, and a
     prefers-reduced-motion guard on the one animation.

     CANVAS
     ------
     Height-sender at the foot of the body, posting all four of
     the message shapes already in use across this repo, so it
     resizes whatever listener the Canvas shell is running.
     Every internal link carries target="_top".
     ============================================================ -->

<style>
  :root{
    /* live Fall 2026 chrome, matched to class1.html and week-1.html */
    --navy:#08101F;
    --navy-soft:#141F33;
    --terra:#8B1D1D;
    --terra-dark:#6B1616;
    --terra-on-navy:#D98E77;   /* 7.3:1 on navy, the accent that works */
    --gold:#DCB45C;
    --gold-pale:#F2E2B8;
    --oxblood:#7A2A22;
    --oxblood-hover:#8B3A2E;
    --white:#FFFFFF;
    --offwhite:#FAFAF9;
    --line:rgba(8,16,31,.14);
    --line-strong:rgba(8,16,31,.28);
    --ink:#08101F;
    --ink-mid:#3D4757;          /* 8.4:1 on white, clears AAA */
    --radius:14px;
    --shadow-rest:0 1px 3px rgba(0,0,0,.08);
    --shadow-lift:0 10px 22px rgba(0,0,0,.12);
    --font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }

  *{box-sizing:border-box}
  html{scroll-padding-top:96px}
  html,body{margin:0}
  body{
    font-family:var(--font);
    background:var(--offwhite);
    color:var(--ink);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  .skip{
    position:absolute;left:-9999px;top:0;z-index:100;
    background:var(--navy);color:var(--white);
    padding:14px 20px;border-radius:0 0 var(--radius) 0;
    font-weight:700;text-decoration:none;
  }
  .skip:focus{left:0}

  :focus-visible{outline:3px solid var(--terra-dark);outline-offset:3px;border-radius:4px}
  [tabindex="-1"]:focus{outline:none}
  .on-navy :focus-visible{outline-color:var(--gold)}

  .wrap{max-width:720px;margin:0 auto;padding:0 20px 72px}

  /* ---------- hero ---------- */
  .hero{
    background:var(--navy);color:var(--white);
    padding:34px 20px 30px;margin-bottom:0;
  }
  .hero-in{max-width:720px;margin:0 auto}
  .eyebrow{
    font-size:11.5px;font-weight:800;letter-spacing:.18em;
    text-transform:uppercase;color:var(--gold);margin:0 0 12px;
  }
  h1{
    font-size:clamp(26px,5.2vw,38px);font-weight:800;
    letter-spacing:-.02em;line-height:1.12;margin:0 0 10px;
  }
  h1 .a{color:var(--terra-on-navy)}
  .hero-sub{font-size:16px;margin:0;color:var(--white);max-width:52ch}
  .hero-meta{
    display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;
  }
  .tag{
    font-size:12px;font-weight:700;letter-spacing:.04em;
    border:1px solid rgba(220,180,92,.55);color:var(--gold-pale);
    border-radius:999px;padding:6px 13px;
  }

  /* ---------- the one thing ---------- */
  .headline-card{
    background:var(--white);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow-rest);
    padding:26px 24px;margin:-18px 0 26px;position:relative;
  }
  .headline-card h2{
    font-size:20px;font-weight:800;margin:0 0 8px;letter-spacing:-.01em;
  }
  .headline-card p{margin:0;color:var(--ink-mid);font-size:15.5px}
  .kicker{
    font-size:11.5px;font-weight:800;letter-spacing:.16em;
    text-transform:uppercase;color:var(--terra-dark);margin:0 0 10px;
  }

  /* ---------- steps ---------- */
  .steps{list-style:none;margin:0;padding:0}
  .step{
    background:var(--white);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow-rest);
    margin-bottom:14px;overflow:hidden;
    transition:box-shadow 200ms ease,border-color 200ms ease;
  }
  .step.is-now{border-color:var(--gold);border-width:2px;box-shadow:var(--shadow-lift)}
  .step.is-done{background:var(--white);border-color:var(--line)}

  .step-head{
    display:flex;gap:14px;align-items:flex-start;width:100%;
    background:none;border:0;margin:0;padding:18px 20px;
    font:inherit;color:inherit;text-align:left;cursor:pointer;
    min-height:44px;
  }
  .step-head:hover{background:#FBFAF8}

  .step-num{
    flex:0 0 auto;width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:800;
    border:2px solid var(--line-strong);color:var(--ink-mid);
    background:var(--white);
  }
  .is-now .step-num{border-color:var(--gold);background:var(--gold);color:var(--navy)}
  .is-done .step-num{border-color:var(--navy);background:var(--navy);color:var(--white)}

  .step-text{flex:1 1 auto;min-width:0}
  /* both of these MUST be block. As spans they run together and read
     as one fused sentence, which is the same defect the audit found
     on the class hub pages. */
  .step-title{display:block;font-size:16.5px;font-weight:700;margin:0;letter-spacing:-.005em}
  .is-done .step-title{color:var(--ink-mid)}
  .step-hint{display:block;margin:4px 0 0;font-size:13.5px;color:var(--ink-mid);line-height:1.45}

  .step-meta{flex:0 0 auto;display:flex;align-items:center;gap:9px;white-space:nowrap}
  .step-mins{
    font-size:12.5px;font-weight:700;color:var(--ink-mid);letter-spacing:.01em;
  }
  .hl-time{
    margin:14px 0 0 !important;font-size:13.5px;font-weight:700;
    color:var(--terra-dark) !important;
  }
  .hl-time[hidden]{display:none}

  /* state is never colour alone: it is spelled out */
  .step-state{
    flex:0 0 auto;font-size:11px;font-weight:800;letter-spacing:.12em;
    text-transform:uppercase;padding:5px 10px;border-radius:999px;
    border:1px solid var(--line-strong);color:var(--ink-mid);
    background:var(--white);white-space:nowrap;
  }
  .is-now .step-state{border-color:var(--terra-dark);color:var(--terra-dark)}
  .is-done .step-state{border-color:var(--navy);background:var(--navy);color:var(--white)}

  .step-body{padding:0 20px 20px 64px}
  .step-body p{margin:0 0 14px;font-size:15px;color:var(--ink-mid)}
  .step-foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
  .step-body p.lead-in{color:var(--ink)}

  .link-list{list-style:none;margin:0 0 16px;padding:0}
  .link-list li{margin:0 0 8px}
  .go{
    display:flex;align-items:center;gap:10px;
    text-decoration:none;color:var(--ink);
    border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;min-height:44px;background:var(--white);
    font-weight:600;font-size:15px;
    transition:border-color 180ms ease,background 180ms ease;
  }
  .go:hover{border-color:var(--gold);background:#FCFAF5}
  .go.is-static{cursor:default;background:var(--offwhite);font-weight:600}
  .go.is-static:hover{border-color:var(--line);background:var(--offwhite)}
  .go .arr{margin-left:auto;color:var(--terra-dark);font-weight:800}
  .go .go-kind{
    font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-mid);border:1px solid var(--line);border-radius:4px;
    padding:2px 6px;
  }

  /* the one action */
  .primary{
    display:inline-flex;align-items:center;gap:11px;
    background:var(--navy);color:var(--white);text-decoration:none;
    border-radius:10px;padding:15px 24px;min-height:44px;
    font-weight:800;font-size:16px;letter-spacing:-.005em;

  .primary:hover{background:#101B33;transform:translateY(-1px)}
  .primary .arr{color:var(--gold);font-weight:800}
  .also{margin:12px 0 0;font-size:13.5px;color:var(--ink-mid);line-height:1.6}
  .also a{color:var(--terra-dark);font-weight:600;text-underline-offset:3px}

  .done-btn{
    display:inline-flex;align-items:center;gap:9px;
    background:var(--white);color:var(--terra-dark);
    border:1.5px solid var(--line-strong);border-radius:10px;
    padding:12px 20px;min-height:44px;
    font:inherit;font-weight:700;font-size:14.5px;cursor:pointer;
    transition:border-color 180ms ease,background 180ms ease;
  }
  .done-btn:hover{border-color:var(--terra-dark);background:#FCFAF8}
  .undo-btn{
    display:inline-flex;align-items:center;min-height:44px;
    background:none;border:0;padding:10px 4px;font:inherit;
    font-size:13.5px;font-weight:700;color:var(--terra-dark);
    text-decoration:underline;cursor:pointer;
  }

  /* ---------- glossary ---------- */
  .gloss{
    background:none;border:0;padding:0;font:inherit;cursor:pointer;
    color:var(--terra-dark);font-weight:700;
    text-decoration:underline;text-decoration-style:dotted;
    text-underline-offset:3px;
  }
  .gloss-block{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .gloss-list{margin:12px 0 0;padding:0}
  .gloss-list[hidden]{display:none}
  .gloss-list dt{
    font-weight:800;font-size:14px;color:var(--ink);margin:0 0 3px;
  }
  .gloss-list dd{
    margin:0 0 14px;padding:0 0 0 14px;font-size:14px;color:var(--ink-mid);
    border-left:2px solid var(--gold);
  }
  .gloss-list dd:last-child{margin-bottom:0}
  .gloss-note{
    margin:10px 0 0;padding:12px 14px;font-size:14px;
    background:var(--white);border:1px solid var(--line);
    border-left:3px solid var(--gold);border-radius:0 8px 8px 0;
    color:var(--ink-mid);
  }
  .gloss-note[hidden]{display:none}

  /* ---------- an optional offer, never a demand ---------- */
  .optional{
    background:var(--white);border:1px dashed var(--line-strong);
    border-radius:var(--radius);padding:20px 22px;margin-top:4px;
  }
  .optional[hidden]{display:none}
  .opt-t{margin:0 0 14px;font-size:15px;color:var(--ink-mid)}
  .opt-btn{
    background:var(--white);color:var(--terra-dark);
    border:1.5px solid var(--line-strong);border-radius:10px;
    padding:12px 20px;min-height:44px;font:inherit;font-weight:700;
    font-size:14.5px;cursor:pointer;transition:border-color 180ms ease;
  }
  .opt-btn:hover{border-color:var(--terra-dark)}

  /* ---------- footer strip ---------- */
  .foot{
    margin-top:34px;padding-top:20px;border-top:1px solid var(--line);
    font-size:13px;color:var(--ink-mid);
  }
  .foot a{color:var(--terra-dark);font-weight:700}

  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
  }

  /* ---------- first-run walkthrough ---------- */
  .wt{
    position:fixed;inset:0;z-index:60;background:var(--navy);
    display:flex;align-items:center;justify-content:center;padding:28px 22px;
  }
  .wt[hidden]{display:none}
  .wt-in{max-width:560px;text-align:center;color:var(--white)}
  .wt-line{
    opacity:0;margin:0 0 20px;font-size:clamp(18px,3.4vw,23px);
    font-weight:700;line-height:1.4;letter-spacing:-.01em;
    animation:fade 640ms ease forwards;
  }
  .wt-line .a{color:var(--terra-on-navy)}
  .wt-line.s{font-size:15.5px;font-weight:400;color:var(--gold-pale)}
  @keyframes fade{to{opacity:1}}
  .wt-btn{
    margin-top:14px;background:var(--oxblood);color:var(--white);
    border:0;border-radius:10px;padding:15px 30px;min-height:44px;
    font:inherit;font-weight:800;font-size:16px;cursor:pointer;
  }
  .wt-btn:hover{background:var(--oxblood-hover)}
  .wt-skip{
    display:block;margin:16px auto 0;background:none;border:0;
    font:inherit;font-size:14px;font-weight:700;color:var(--gold-pale);
    text-decoration:underline;cursor:pointer;min-height:44px;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important}
    .wt-line{opacity:1;animation:none}
  }
</style>

<script>
(function(){
  'use strict';

  var STORE_STEPS = 'bio004-today-steps';
  var STORE_WT    = 'bio004-today-walkthrough';
  var STORE_SEC   = 'bio004-section';

  function ls(k,v){
    try{
      if(v===undefined) return window.localStorage.getItem(k);
      window.localStorage.setItem(k,v); return v;
    }catch(e){ return null; }
  }
  function lsDel(k){ try{ window.localStorage.removeItem(k); }catch(e){} }

  /* ---------- date, honest about the local day ---------- */
  function iso(d){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function parseIso(s){
    var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]);
  }
  var qs = new URLSearchParams(window.location.search);
  var TODAY = qs.get('today') ? parseIso(qs.get('today')) : new Date();
  TODAY.setHours(0,0,0,0);
  var TODAY_ISO = iso(TODAY);
  var HOUR = qs.get('hour') ? parseInt(qs.get('hour'),10) : new Date().getHours();

  function longDate(d){
    return d.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'});
  }
  function shortDate(d){
    return d.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'});
  }
  function daysBetween(a,b){ return Math.round((b-a)/86400000); }

  /* ---------- section ---------- */
  var SECTIONS = window.BIO004_SECTIONS || null;
  var SESSIONS = window.BIO004_SESSIONS || null;
  var LINKS    = window.BIO004_SESSION_LINKS || null;

  /* section keys used across this repo: mw | tr-am | tr-eve */
  var SEC_META = {
    'mw':     { label:'Mon / Wed, Afternoon', track:'mw', hub:'class1.html', crn:'80650',
                id:'class1', lec:'12:30 to 1:50 pm, VC 118',   lab:'2:00 to 4:50 pm, VC 1137',  endHour:17, lecMin:80, labMin:170 },
    'tr-am':  { label:'Tue / Thu, Morning',   track:'tr', hub:'class2.html', crn:'80654',
                id:'class2', lec:'9:30 to 10:45 am, VC 212',   lab:'11:00 am to 1:50 pm, VC 1137', endHour:14, lecMin:75, labMin:170 },
    'tr-eve': { label:'Tue / Thu, Evening',   track:'tr', hub:'class3.html', crn:'80655',
                id:'class3', lec:'5:30 to 6:45 pm, VC 118',    lab:'7:00 to 9:50 pm, VC 1137',  endHour:22, lecMin:75, labMin:170 }
  };
  var secKey = ls(STORE_SEC);
  if(!SEC_META[secKey]) secKey = null;

  /* ---------- day model ---------- */
  function sessionsFor(track){
    if(!SESSIONS) return [];
    return (SESSIONS[track] || []).slice();
  }

  function findDay(track, isoDate){
    var arr = sessionsFor(track);
    for(var i=0;i<arr.length;i++){ if(arr[i].date === isoDate) return arr[i]; }
    return null;
  }

  /* the next real class day strictly after isoDate, skipping days off */
  function nextClassDay(track, isoDate){
    var arr = sessionsFor(track);
    for(var i=0;i<arr.length;i++){
      if(arr[i].date > isoDate && arr[i].kind !== 'off') return arr[i];
    }
    return null;
  }
  function prevClassDay(track, isoDate){
    var arr = sessionsFor(track), found=null;
    for(var i=0;i<arr.length;i++){
      if(arr[i].date < isoDate && arr[i].kind !== 'off') found = arr[i];
    }
    return found;
  }

  function stripTags(s){ return String(s||'').replace(/<[^>]*>/g,'').replace(/&middot;/g,'·').replace(/&amp;/g,'&'); }

  /* A TBL day announces itself in the session copy as "TBL 6 · Respiratory". */
  function isTBLDay(day){
    if(!day || !day.lines) return false;
    return day.lines.some(function(l){ return /TBL\s*\d/.test(l[1] || ''); });
  }
  function tblName(day){
    if(!day || !day.lines) return '';
    for(var i=0;i<day.lines.length;i++){
      var m = stripTags(day.lines[i][1]).match(/TBL\s*\d+\s*·?\s*(.*)/);
      if(m) return stripTags(day.lines[i][1]);
    }
    return '';
  }

  /* Which module a week belongs to. Shared weeks resolve FORWARD, because a
     shared week is the one that opens the next module. */
  function moduleForWeek(wk){
    var M = window.BIO004_MODULES || [];
    var found = null;
    M.forEach(function(m){ if(m.weeks.indexOf(wk) !== -1) found = m.n; });
    return found;
  }

  function nextExamJustSat(){
    var sec = SECTIONS && SECTIONS.sections ? SECTIONS.sections[SEC_META[secKey].id] : null;
    if(!sec || !sec.exams) return null;
    for(var i=0;i<sec.exams.length;i++){
      if((sec.exams[i].practical || sec.exams[i].lecture) === TODAY_ISO) return sec.exams[i];
    }
    return null;
  }

  function nextExam(){
    var sec = SECTIONS && SECTIONS.sections ? SECTIONS.sections[SEC_META[secKey].id] : null;
    if(!sec || !sec.exams) return null;
    for(var i=0;i<sec.exams.length;i++){
      var d = sec.exams[i].practical || sec.exams[i].lecture;
      if(d >= TODAY_ISO) return { n:sec.exams[i].n, date:d, covers:sec.exams[i].practicalCovers || '' };
    }
    return null;
  }

  function dayTopics(day){
    if(!day) return [];
    if(day.lines) return day.lines.map(function(l){ return {k:stripTags(l[0]), v:stripTags(l[1])}; });
    if(day.text)  return day.text.map(function(t){ return {k:'', v:stripTags(t)}; });
    return [];
  }

  /* ---------- steps ---------- */
  var doneMap = {};
  try{ doneMap = JSON.parse(ls(STORE_STEPS) || '{}') || {}; }catch(e){ doneMap = {}; }

  function doneKey(targetIso, idx){ return targetIso + ':' + idx; }
  function isDone(targetIso, idx){ return !!doneMap[doneKey(targetIso, idx)]; }
  function setDone(targetIso, idx, val){
    var k = doneKey(targetIso, idx);
    if(val) doneMap[k] = 1; else delete doneMap[k];
    ls(STORE_STEPS, JSON.stringify(doneMap));
  }

  var GLOSSARY = {
    'pre-work': 'The sheet you work at home before class. It is not a study guide and it is not the notes. You work it with the notes and the reading open beside you, in your own handwriting, and you bring the written copy to class.',
    'brain dump': 'Five minutes at the start of class. Blank paper, closed notes, closed book, phone away. You write everything you can retrieve about the question on the board. A real, organized attempt earns full credit. A few scattered words earns nothing.',
    'Loops': 'The short concept videos Dr. Rennie records. You watch one after you have worked the sheet, never before. It is the check on your thinking, not the source you copy from.',
    'TBL': 'Team-Based Learning. You come prepared, take a short readiness quiz alone (the iRAT), take the same quiz again with your team (the tRAT), argue the ones you got wrong, then your team works a hard case with every other team at the same time.',
    'structure list': 'The lab list of everything you are expected to find and name on a model, a slide, or a specimen. You bring it to lab and fill it in as you go. It is what the lab practical is built from.',
    'lab sprint': 'A short focused run at one lab topic: the structures, what to look for, and a quick self-check.',
    'spaced recall': 'Short retrieval sessions spread across the week. You do them AFTER the class that taught the material, not the same night you did the pre-work.',
    'lab practical': 'The hands-on half of an exam. You rotate through stations and identify structures on models, slides, and specimens. Spelling counts, pen only, and the doors lock when it starts.'
  };

  function glossify(text){
    var out = text;
    Object.keys(GLOSSARY).forEach(function(term){
      var re = new RegExp('\\b(' + term.replace(/[-\/\\^$*+?.()|[\]{}]/g,'\\$&') + ')\\b', 'i');
      if(re.test(out) && out.indexOf('data-gloss') === -1){
        out = out.replace(re, '<button class="gloss" type="button" data-gloss="' + term + '" aria-expanded="false">$1</button>');
      }
    });
    return out;
  }

  function linkItem(kind, url, title, ext){
    var t = ext ? ' target="_blank" rel="noopener"' : ' target="_top"';
    return '<li><a class="go" href="' + url + '"' + t + '>' +
           '<span class="go-kind">' + kind + '</span>' +
           '<span>' + title + '</span>' +
           '<span class="arr" aria-hidden="true">&rarr;</span>' +
           '<span class="sr-only">, opens ' + title + (ext ? ' in a new tab' : '') + '</span>' +
           '</a></li>';
  }

  /* ---------- build the plan for the moment ----------
     Seven day-types, taken straight from her own flow diagrams:

       Prework .............. Worksheet > Videos + add to notes > Pre-study lab structures
       Class day, regular ... Brain dump > Active Learning/Success > Round Tables (Lab)
       Class day, TBL ....... iRAT/tRAT > Application Exercise > Round Tables (Lab)
       Class day, exam ...... Lab exam > Lecture exam
       After class day ...... Mastery OS + Recall Rx (lecture) > Loops (labs)
       Non-class day ........ Mastery OS / Recall cards > Loops, plus an occasional Gap Finder
       Exam minus 3 ......... Gap Finder on both banks > build a 3 day plan
     -------------------------------------------------------- */

  var LOOPS_URL = 'https://drsrennie-stack.github.io/loops/';

  /* ---------- HOW LONG THINGS TAKE ----------
     Minutes, and the ONLY place they are set. Students chronically
     underestimate pre-work and then feel ambushed by it, so the honest
     number is shown up front rather than discovered at midnight.

     These are estimates for a student who did the reading, not a floor
     and not a target. Change a number here and it changes on the step,
     in the nightly total, and nowhere else needs touching.

     In-class steps are NOT estimated, they are timetabled: the lecture
     and lab block lengths come from the section itself, below. */
  var EST = {
    worksheet:  40,   // the substantial one. Handwritten, notes open.
    videos:     15,   // concept videos plus annotating the notes
    structures: 15,   // structure list, atlas, a look at the lab sprint
    cards:      15,   // a Recall Rx session
    loops:      10,
    slides:     10,   // one read, no notes taken
    gapfinder:  10,
    plan:       10,   // writing the three day plan
    prerecall:  15,   // Mastery OS on the topic you just prepped, same night
    braindump:   5    // start of class, on the clock
  };

  function mins(n){
    if(!n) return '';
    if(n < 60) return n + ' min';
    var h = Math.floor(n/60), m = n % 60;
    return h + (h===1?' hour':' hours') + (m ? ' ' + m + ' min' : '');
  }
  function totalMins(steps){
    return (steps||[]).reduce(function(a,st){ return a + (st.mins || 0); }, 0);
  }

  function buildPlan(){
    var meta   = SEC_META[secKey];
    var track  = meta.track;
    var today  = findDay(track, TODAY_ISO);
    var isClassToday = today && today.kind !== 'off';
    var termStart = (SECTIONS && SECTIONS.start) || '2026-08-17';
    var inClassNow  = isClassToday && HOUR < meta.endHour;

    /* BEFORE THE TERM. The night before day one is NOT this case, it falls
       through to the ordinary pre-work path. */
    if(TODAY_ISO < termStart && daysBetween(TODAY, parseIso(termStart)) > 1){
      var d = daysBetween(TODAY, parseIso(termStart));
      var first = findDay(track, termStart) || nextClassDay(track, '2026-08-16');
      return { heroH1:'Not yet. <span class="a">Soon.</span>',
        heroSub:'The term starts ' + longDate(parseIso(termStart)) + '. Here is what to do before then.',
        kicker: d === 1 ? 'Tomorrow' : 'In ' + d + ' days',
        title:'Get set up before day one',
        body:'Nothing is due yet. These take about half an hour and mean you walk in on day one already oriented.',
        target:termStart, steps:preTermSteps(first),
        foot:'Come back here on ' + shortDate(parseIso(termStart)) + ' and this page will show you that day.' };
    }

    /* AFTER THE LAST DAY */
    var lastDay = sessionsFor(track).slice(-1)[0];
    if(lastDay && TODAY_ISO > lastDay.date){
      return { heroH1:'That is the <span class="a">whole term.</span>',
        heroSub:'Every class day is behind you.', kicker:'Done',
        title:'The course is finished',
        body:'Your grade is in Canvas. The notes and the atlas stay up if you are heading into the next course.',
        target:TODAY_ISO, steps:[], foot:'Thank you for the term.' };
    }

    /* ===== CLASS DAY, while it is still running ===== */
    if(inClassNow){
      if(today.kind === 'exam'){
        var ex = nextExam();
        return { heroH1:'Exam day.',
          heroSub:longDate(TODAY) + '. Both parts today. Doors lock when each one starts.',
          kicker:'Today', title:'Lab practical, then the lecture exam',
          body:'Pen only, not pencil. Spelling counts on the practical. Nothing new goes in today, so read your own pre-work sheets rather than starting anything fresh.',
          target:TODAY_ISO, steps:examSteps(ex),
          foot:'Rebuttals happen at the next class meeting, so keep your questions.' };
      }
      if(isTBLDay(today)){
        return { heroH1:'TBL <span class="a">today.</span>',
          heroSub:longDate(TODAY) + '. ' + (tblName(today) || 'Team-Based Learning') + '.',
          kicker:'Today', title:'Readiness first, then the application',
          body:'You take the readiness test alone, then again with your team, then the whole room works the same problem at the same time. Come with the pre-work done, there is no catching up inside a TBL.',
          target:TODAY_ISO, steps:tblDaySteps(today), timetabled:true, foot:eveningFoot(track) };
      }
      return { heroH1:'Class <span class="a">today.</span>',
        heroSub:longDate(TODAY) + '. Here is the order it runs in.',
        kicker:'Today', title:'Bring your written pre-work',
        body:'Class opens with a brain dump on the pre-work you did last night. That one cannot be made up if you arrive without it.',
        target:TODAY_ISO, steps:classDaySteps(today), timetabled:true, foot:eveningFoot(track) };
    }

    /* ===== everything below is the evening, or a day with no class ===== */
    var next = nextClassDay(track, TODAY_ISO);
    var gap  = next ? daysBetween(TODAY, parseIso(next.date)) : null;
    var preworkTonight = (gap === 1) || (isClassToday && next && daysBetween(TODAY, parseIso(next.date)) === 1);
    var ex3 = nextExam();
    var toExam = ex3 ? daysBetween(TODAY, parseIso(ex3.date)) : null;

    /* EXAM MINUS 3. The gap finder run, and the three day plan. */
    if(toExam === 3){
      var steps = examPlanSteps(ex3);
      if(preworkTonight) steps = steps.concat(preworkSteps(next));
      return { heroH1:'Exam 4 <span class="a">in three days.</span>'.replace('4', ex3.n),
        heroSub:'Exam ' + ex3.n + ' is ' + longDate(parseIso(ex3.date)) + '. Tonight you find the gaps and plan the three days.',
        kicker:'Three days out', title:'Find the gaps before you study anything',
        body:'Studying what you already know feels good and changes nothing. Run both gap finders first, then the plan writes itself around what they surface.',
        target:TODAY_ISO, steps:steps,
        foot:'Nothing new goes in after tonight. The next three days are repair and retrieval only.' };
    }

    /* THE EVENING OF AN EXAM DAY. Nothing is due. Note that "the next
       class" is NOT tomorrow: sections meet Mon/Wed or Tue/Thu, so an
       exam on a Wednesday is followed by five days, and an exam on a
       Tuesday by two. It is computed, never assumed. */
    if(isClassToday && today.kind === 'exam'){
      var sat = nextExamJustSat();
      if(!next){
        return { heroH1:'That was the <span class="a">last one.</span>',
          heroSub:(sat ? 'Exam ' + sat.n + ' is behind you, and so is the term.' : 'The term is behind you.'),
          kicker:'Tonight', title:'Nothing is due, tonight or after',
          body:'Close the laptop. The notes and the atlas stay up if you are heading into the next course.',
          target:TODAY_ISO, steps:[], foot:'Thank you for the term.' };
      }
      var gapAfter = daysBetween(TODAY, parseIso(next.date));
      return {
        heroH1:'You earned the <span class="a">night off.</span>',
        heroSub:(sat ? 'Exam ' + sat.n + ' is behind you. ' : '') +
                'Next class is ' + longDate(parseIso(next.date)) +
                (gapAfter > 1 ? ', ' + gapAfter + ' days away.' : '.'),
        kicker:'Tonight',
        title:'Nothing is due tonight',
        body:'Close the laptop. You have spent a whole day proving what you know, and another hour tonight will not add to it. Rest is part of the method, not a break from it.',
        target:TODAY_ISO, steps:[],
        optional:{ text:'If you would rather get ahead, the pre-work for ' + shortDate(parseIso(next.date)) + ' is ready whenever you want it. It is not due until the night before.',
                   cta:'Start it early', date:next.date },
        foot:'Rebuttals happen at the next class meeting, so keep your exam questions.' };
    }

    if(!next && !(isClassToday && today.kind === 'exam')){
      return { heroH1:'No class today.', heroSub:'And no class days left on the schedule.',
        kicker:'Nothing due', title:'Nothing scheduled', body:'',
        target:TODAY_ISO, steps:[], foot:'' };
    }

    /* PRE-WORK. The night before a class day. */
    if(preworkTonight){
      return { heroH1:'Tonight is <span class="a">pre-work.</span>',
        heroSub:'Class is ' + longDate(parseIso(next.date)) + '. Four things, in this order.',
        kicker:'Tonight', title:'Sheet, video, lab structures, then recall',
        body:'The order is the whole point. The sheet finds out what you do not know, the video fills it in, the structures get your eyes on lab before you walk in, and the recall makes tomorrow morning\'s brain dump something you can actually do.',
        target:next.date, steps:preworkSteps(next),
        foot:'Bring the written sheet. Class opens with a brain dump on it.' };
    }

    /* AFTER A CLASS DAY. The evening of a day you were in class. */
    if(isClassToday){
      return { heroH1:'After class.',
        heroSub:'Next class is ' + longDate(parseIso(next.date)) + '. Tonight is consolidation, not new intake.',
        kicker:'Tonight', title:'Lock in what you sat through today',
        body:'Two passes, one for the lecture material and one for lab. Short beats long here.',
        target:TODAY_ISO, steps:afterClassSteps(findDay(track, TODAY_ISO)),
        foot:'Pre-work for ' + shortDate(parseIso(next.date)) + ' opens here the night before.' };
    }

    /* NON-CLASS DAY. */
    return { heroH1:'No class today.',
      heroSub:'Next class is ' + longDate(parseIso(next.date)) + ', in ' + gap + ' days.',
      kicker:'Today', title:'Retrieval day',
      body:'This is the gap the course is designed around. Rereading feels productive and does almost nothing. Getting it back out is what moves it.',
      target:TODAY_ISO, steps:nonClassSteps(ex3, toExam),
      foot:'Pre-work for ' + shortDate(parseIso(next.date)) + ' opens here the night before.' };
  }

  /* Getting ahead is the same pre-work, framed as a choice rather than a task. */
  function buildPreworkPlan(dateIso){
    var track = SEC_META[secKey].track;
    var day = findDay(track, dateIso);
    return { heroH1:'Getting <span class="a">ahead.</span>',
      heroSub:'Pre-work for ' + longDate(parseIso(dateIso)) + '. Nothing here is due tonight.',
      kicker:'Optional', title:'Sheet, video, lab structures, then recall',
      body:'You do not have to do this tonight. If you would rather stop, stop. It will be here.',
      target:dateIso, steps:preworkSteps(day),
      foot:'Bring the written sheet. Class opens with a brain dump on it.' };
  }

  function eveningFoot(track){
    var nx = nextClassDay(track, TODAY_ISO);
    if(!nx) return 'No further class days.';
    return daysBetween(TODAY, parseIso(nx.date)) === 1
      ? 'Tonight becomes pre-work for ' + shortDate(parseIso(nx.date)) + '. Come back and it will be laid out.'
      : 'Tonight is consolidation. Come back this evening and it will change over.';
  }

  /* PREWORK :: Worksheet > Watch videos and add to notes > Pre-study lab structures */
  function preworkSteps(next){
    var L = LINKS ? LINKS[next.date] : null;
    var mod = moduleForWeek(next.wk);
    var s = [];

    s.push({
      title:'Work the pre-work sheet',
      mins:EST.worksheet,
      hint:'Handwritten. This is the one thing that has to happen tonight.',
      body:'<p class="lead-in">This is the real work of the night. Where you cannot answer something, leave the gap visible rather than tidying it away. That gap is the point.</p>',
      /* Notes and workbooks are NOT tasks. They are what the sheet is
         worked against. They ride under the one action rather than
         becoming three more things that look due. */
      also:'Open these beside it, they are reference and not tasks',
      links:(L && L.sheets ? L.sheets.map(function(n){ return {kind:'Worksheet', url:n.u, title:n.t, cta:'Open the pre-work sheet'}; }) : [])
            .concat(L && L.notes ? L.notes.map(function(n){ return {kind:'Notes', url:n.u, title:n.t}; }) : [])
            .concat(L && L.workbooks ? L.workbooks.map(function(n){ return {kind:'Workbook', url:n.u, title:n.t}; }) : [])
    });

    s.push({
      title:'Watch the videos and add to your notes',
      mins:EST.videos,
      hint:'After the worksheet. The video is the check, not the source.',
      body:'<p>Write straight onto your notes as you watch. Anything the video says that you did not have, add it. Anything you had wrong, correct it in a different colour so you can find it later.</p>',
      also:'Also this week',
      links:(L && L.videos ? L.videos.map(function(n,ix){ return {kind:'Video', url:n.u, title:n.t, cta: ix===0 ? 'Watch the video' : null}; }) : [])
    });

    /* Two things, not six. The structure list NAMES the structures, the
       atlas is where you SEE them. That pair is the whole of pre-study.
       The lab sprints are deliberately not here: they are the lab itself,
       they already sit on the class day, and four of them turns a 15
       minute step into a menu. */
    var lab = [{kind:'Atlas', url:'atlas-coloring-book.html', title:'the atlas'}];
    if(mod) lab.unshift({kind:'Structures', url:'module-' + mod + '-structure-list.html', title:'Module ' + mod + ' lab structure list', cta:'Open the structure list'});
    s.push({
      title:'Pre-study the lab structures',
      mins:EST.structures,
      hint:'So lab is recognition, not first contact.',
      body:'<p>Read through the structures you will be handed tomorrow, then put your eyes on them in the atlas. You are not memorising here, you are making tomorrow familiar. Bring the list with you, you fill it in as you go.</p>',
      also:'Then put your eyes on them in',
      links:lab
    });

    /* The brain dump lands in the morning, on exactly this material. Running
       it through Mastery OS tonight makes that dump retrieval rather than a
       surprise, and it is the ONLY retrieval that belongs on a pre-work
       night, because the material has just been processed. */
    s.push({
      title:'Run it through Mastery OS',
      mins:EST.prerecall,
      hint:'Last thing. On tonight\'s topics, not the whole course.',
      body:'<p>Class opens with a brain dump on this exact material. A short run of cards tonight is the difference between retrieving it in the morning and meeting it cold.</p>',
      also:'Or go straight to',
      links:[{kind:'Hub', url:'mastery-os-fall-2026.html', title:'Mastery OS', cta:'Run tonight\'s topics'},
             {kind:'Cards', url:'bio004-spaced-recall.html', title:'the cards'}]
    });
    return s;
  }

    var topics = dayTopics(today);
    var lecture = topics.filter(function(t){ return /class|lecture/i.test(t.k); });
    var labs    = topics.filter(function(t){ return /lab/i.test(t.k); });

    function rows(list){
      if(!list.length) return '';
      return '<ul class="link-list">' + list.map(function(t){
        return '<li class="go is-static"><span class="go-kind">' + (t.k || 'Today') + '</span><span>' + t.v + '</span></li>';
      }).join('') + '</ul>';
    }

    return [
      { title:'Brain dump', mins:EST.braindump,
        hint:'Lecture block, ' + meta.lec + '. First thing, five minutes.',
        body:'<p>Blank paper, closed notes, closed book, phone away. On the pre-work you did last night. A real organised attempt earns full credit, a few scattered words earns nothing.</p>',
        links:[] },
      { title:'Active learning and success', mins:meta.lecMin - EST.braindump,
        hint:'Lecture block. The rest of the lecture hour.',
        body:'<p>This is the part that only works if the pre-work is done. We are applying it, not receiving it.</p>' + rows(lecture),
        links:[] },
      { title:'Round tables, practice rounds', mins:meta.labMin,
        hint:'Lab block, ' + meta.lab + '.',
        body:'<p>Rotating rounds at the bench. Name it, place it, describe it, connect it, then teach it back to your table.</p>' + rows(labs),
        links:[{kind:'How it runs', url:'spiral-rounds.html', title:'how the rounds work', cta:'How the rounds work'}] }

    return s;
  }

  /* EXAM MINUS 3 :: Gap Finder on both banks > build the three day plan */
  function examPlanSteps(ex){
    var d1 = new Date(TODAY); d1.setDate(d1.getDate()+1);
    var d2 = new Date(TODAY); d2.setDate(d2.getDate()+2);
    return [
      { title:'Gap Finder on the recall cards', mins:EST.gapfinder,
        hint:'First. Before you decide what to study.',
        body:'<p>It surfaces the lecture topics with no card history and the ones you keep missing. Write the list down, it becomes the plan.</p>',
        also:'Then check',
        links:[{kind:'Tool', url:'card-gap-finder.html', title:'Card Gap Finder', cta:'Find my gaps'},
               {kind:'Weak spots', url:'bio004-spaced-recall-weakness-dashboard.html', title:'your weakest topics'}] },
      { title:'Gap Finder on the loops', mins:EST.gapfinder,
        hint:'The lab half. Same job, different material.',
        body:'<p>Structures you cannot name cold are the ones the practical will find. Add them to the same list.</p>',
        links:[{kind:'Loops', url:LOOPS_URL, title:'Anatomy Loops', ext:true, cta:'Run the loops'}] },
      { title:'Write the three day plan', mins:EST.plan,
        hint:'Three days, three passes. Not three days of rereading.',
        body:'<p><strong>' + shortDate(TODAY) + ', tonight.</strong> The weakest third of your list. Cards and loops only, no notes open.</p>' +
             '<p><strong>' + shortDate(d1) + '.</strong> The middle third, then go back over tonight\'s weakest third blind.</p>' +
             '<p><strong>' + shortDate(d2) + '.</strong> The last third, then one full pass of everything the gap finders flagged. Stop early. Sleep beats one more hour.</p>' +
             '<p>Nothing new goes in after tonight.</p>',
        links:ex ? [{kind:'Scope', url:'bio004-exam-modules.html', title:'the scope', cta:'What Exam ' + ex.n + ' covers'}] : [] }
    ];
  }

  /* "Occasional" means it has actually been a while, not a calendar trick. */
  function dueForGapFinder(){
    var last = ls('bio004-today-gapfinder');
    if(!last) return true;
    return daysBetween(parseIso(last), TODAY) >= 7;
  }
  function markGapFinderShown(){ ls('bio004-today-gapfinder', TODAY_ISO); }

  /* ---------- render ---------- */
  var elSteps = document.getElementById('steps');
  var elAnnounce = document.getElementById('announce');
  var PLAN = null;

  function render(){
    document.getElementById('hero-h1').innerHTML = PLAN.heroH1;
    document.getElementById('hero-sub').textContent = PLAN.heroSub;
    document.getElementById('hl-kicker').textContent = PLAN.kicker;
    document.getElementById('hl-title').textContent = PLAN.title;
    document.getElementById('hl-body').innerHTML = glossify(PLAN.body || '');

    /* The total goes up front, not discovered at midnight. Class-day plans
       are timetabled rather than homework, so they say so. */
    var tot = totalMins(PLAN.steps);
    var totEl = document.getElementById('hl-time');
    if(tot){
      totEl.hidden = false;
      totEl.textContent = PLAN.timetabled
        ? 'About ' + mins(tot) + ' of class time, lecture and lab together.'
        : 'About ' + mins(tot) + ' in total. Estimates, not a target.';
    } else { totEl.hidden = true; }
    document.getElementById('foot-line').textContent = PLAN.foot || '';

    var meta = SEC_META[secKey];
    var mh = document.getElementById('hero-meta');
    mh.innerHTML = '<span class="tag">' + meta.label + '</span>' +
                   '<span class="tag">CRN ' + meta.crn + '</span>' +
                   '<span class="tag">' + longDate(TODAY) + '</span>';

    var nowIdx = -1;
    for(var i=0;i<PLAN.steps.length;i++){
      if(!isDone(PLAN.target, i)){ nowIdx = i; break; }
    }
    var allDone = PLAN.steps.length > 0 && nowIdx === -1;

    elSteps.innerHTML = PLAN.steps.map(function(st, i){
      var done = isDone(PLAN.target, i);
      var isNow = (i === nowIdx);
      var cls = 'step' + (done ? ' is-done' : '') + (isNow ? ' is-now' : '');
      var state = done ? 'Done' : (isNow ? 'Now' : 'Later');
      var open = isNow;

      /* ONE thing to click. The step's first link is the action. Anything
         else it needs sits underneath as plain text links, deliberately
         quieter, so the student is never choosing between equals. */
      var links = '';
      if(st.links && st.links.length){
        var first = st.links[0];
        var attr  = first.ext ? ' target="_blank" rel="noopener"' : ' target="_top"';
        links = '<a class="primary" href="' + first.url + '"' + attr + '>' +
                  '<span>' + (first.cta || 'Open ' + first.title) + '</span>' +
                  '<span class="arr" aria-hidden="true">&rarr;</span>' +
                  (first.ext ? '<span class="sr-only"> (opens in a new tab)</span>' : '') +
                '</a>';
        var rest = st.links.slice(1);
        if(rest.length){
          links += '<p class="also">' + (st.also || 'Open beside it') + ': ' +
            rest.map(function(l){
              var a = l.ext ? ' target="_blank" rel="noopener"' : ' target="_top"';
              return '<a href="' + l.url + '"' + a + '>' + l.title + '</a>';
            }).join(', ') + '</p>';
        }
      }

      return '<li class="' + cls + '"' + (isNow ? ' aria-current="step"' : '') + '>' +
        '<button class="step-head" type="button" aria-expanded="' + open + '" aria-controls="sb' + i + '">' +
          '<span class="step-num" aria-hidden="true">' + (done ? '✓' : (i+1)) + '</span>' +
          '<span class="step-text">' +
            '<span class="step-title">' + st.title + '</span>' +
            (st.hint ? '<span class="step-hint">' + st.hint + '</span>' : '') +
          '</span>' +
          '<span class="step-meta">' +
            (st.mins ? '<span class="step-mins">' + mins(st.mins) + '</span>' : '') +
            '<span class="step-state">' + state + '</span>' +
          '</span>' +
        '</button>' +
        '<div class="step-body" id="sb' + i + '"' + (open ? '' : ' hidden') + '>' +
          glossify(st.body || '') + links +
          '<div class="step-foot">' + (done
            ? '<button class="undo-btn" type="button" data-undo="' + i + '">Not done after all</button>'
            : '<button class="done-btn" type="button" data-done="' + i + '">Done, next step</button>') + '</div>' +
        '</div>' +
      '</li>';
    }).join('');

    /* An optional offer is a plain link, never a button. A night off that
       carries a call to action is not a night off. */
    var opt = document.getElementById('optional');
    if(PLAN.optional){
      opt.hidden = false;
      opt.innerHTML = '<p class="opt-t">' + PLAN.optional.text + '</p>' +
        '<button class="opt-btn" type="button" id="opt-go">' + PLAN.optional.cta + '</button>';
      document.getElementById('opt-go').addEventListener('click', function(){
        PLAN = buildPreworkPlan(PLAN.optional.date);
        render(); focusCurrent();
      });
    } else { opt.hidden = true; opt.innerHTML = ''; }

    if(PLAN.steps.some(function(st){ return st.title === 'Run a Gap Finder'; })) markGapFinderShown();

    if(allDone){
      document.getElementById('hl-kicker').textContent = 'All done';
      document.getElementById('hl-title').textContent = 'That is everything for now';
      document.getElementById('hl-body').textContent = 'Nothing else is asked of you today. Close the laptop.';
    }

  }

  /* ---------- interaction ---------- */
  elSteps.addEventListener('click', function(e){
    var head = e.target.closest('.step-head');
    if(head){
      var body = document.getElementById(head.getAttribute('aria-controls'));
      var open = head.getAttribute('aria-expanded') === 'true';
      head.setAttribute('aria-expanded', String(!open));
      body.hidden = open;
      return;
    }
    var d = e.target.closest('[data-done]');
    if(d){
      var i = +d.getAttribute('data-done');
      setDone(PLAN.target, i, true);
      elAnnounce.textContent = 'Step ' + (i+1) + ' marked done.';
      render(); focusCurrent(); return;
    }
    var u = e.target.closest('[data-undo]');
    if(u){
      var j = +u.getAttribute('data-undo');
      setDone(PLAN.target, j, false);
      elAnnounce.textContent = 'Step ' + (j+1) + ' reopened.';
      render(); focusCurrent(); return;
    }
  });

  function focusCurrent(){
    var cur = elSteps.querySelector('.is-now .step-head');
    if(cur) cur.focus();
    else {
      var h = document.getElementById('hl-title');
      h.setAttribute('tabindex','-1'); h.focus();
    }
  }

  /* glossary, delegated across the whole main region */
  document.getElementById('main').addEventListener('click', function(e){
    var g = e.target.closest('[data-gloss]');
    if(!g) return;
    var term = g.getAttribute('data-gloss');
    var open = g.getAttribute('aria-expanded') === 'true';
    var next = g.parentNode.querySelector('.gloss-note[data-for="'+term+'"]');
    if(open){
      if(next) next.hidden = true;
      g.setAttribute('aria-expanded','false');
      return;
    }
    if(!next){
      next = document.createElement('p');
      next.className = 'gloss-note';
      next.setAttribute('data-for', term);
      next.textContent = GLOSSARY[term] || '';
      g.parentNode.appendChild(next);
    }
    next.hidden = false;
    g.setAttribute('aria-expanded','true');
  });

  /* the always-available glossary, so a student never has to open a
     step they are not on yet just to find out what a word means */
  (function(){
    var btn = document.getElementById('gloss-all');
    var list = document.getElementById('gloss-list');
    list.innerHTML = Object.keys(GLOSSARY).map(function(t){
      return '<dt>' + t.charAt(0).toUpperCase() + t.slice(1) + '</dt><dd>' + GLOSSARY[t] + '</dd>';
    }).join('');
    btn.addEventListener('click', function(){
      var open = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', String(!open));
      list.hidden = open;
      btn.textContent = open ? 'New words on this page?' : 'Hide the word list';
    });
  })();

  document.getElementById('switch-sec').addEventListener('click', function(){
    lsDel(STORE_SEC);
    try{ window.localStorage.removeItem('mos-section'); }catch(e){}
    window.top.location.href = 'welcome.html?pick=1';
  });

  /* ---------- section gate ---------- */
  function askSection(){
    document.getElementById('hero-h1').innerHTML = 'Which class are <span class="a">you in?</span>';
    document.getElementById('hero-sub').textContent = 'Pick once. Everything after this follows your section.';
    document.getElementById('hero-meta').innerHTML = '';
    document.getElementById('hl-kicker').textContent = 'One question';
    document.getElementById('hl-title').textContent = 'Pick your section';
    document.getElementById('hl-body').textContent = 'Your CRN is on your Solano registration. This is the only time you will be asked.';
    document.getElementById('foot-line').textContent = '';
    elSteps.innerHTML = Object.keys(SEC_META).map(function(k){
      var m = SEC_META[k];
      return '<li class="step is-now"><button class="step-head" type="button" data-sec="' + k + '">' +
        '<span class="step-num" aria-hidden="true">&rarr;</span>' +
        '<span class="step-text"><span class="step-title">' + m.label + '</span>' +
        '<span class="step-hint">CRN ' + m.crn + '</span></span>' +
        '<span class="step-state">Pick</span></button></li>';
    }).join('');
    elSteps.addEventListener('click', function onPick(e){
      var b = e.target.closest('[data-sec]');
      if(!b) return;
      secKey = b.getAttribute('data-sec');
      ls(STORE_SEC, secKey);
      elSteps.removeEventListener('click', onPick);
      start();
    });
  }

  /* ---------- first-run walkthrough ---------- */
  var WT_LINES = [
    'This page has <span class="a">one job.</span>',
    'It tells you what to do <span class="a">right now,</span> and nothing else.',
    'One step at a time. The rest stay folded away until it is their turn.',
    'Come back here every time you open the course. It will have changed.'
  ];
  function runWalkthrough(after){
    var wt = document.getElementById('wt');
    var lines = document.getElementById('wt-lines');
    var next = document.getElementById('wt-next');
    var skip = document.getElementById('wt-skip');
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var i = 0;

    function finish(){
      wt.hidden = true;
      ls(STORE_WT, '1');
      after();
      var h = document.getElementById('hl-title');
      h.setAttribute('tabindex','-1'); h.focus();
    }
    function show(){
      var p = document.createElement('p');
      p.className = 'wt-line' + (i > 1 ? ' s' : '');
      p.innerHTML = WT_LINES[i];
      lines.appendChild(p);
      i++;
      if(i >= WT_LINES.length) next.textContent = 'Show me today';
    }
    wt.hidden = false;
    if(reduce){
      WT_LINES.forEach(function(t, n){
        var p = document.createElement('p');
        p.className = 'wt-line' + (n > 1 ? ' s' : '');
        p.innerHTML = t; lines.appendChild(p);
      });
      i = WT_LINES.length;
      next.textContent = 'Show me today';
    } else {
      show();
    }
    next.focus();
    next.addEventListener('click', function(){
      if(i < WT_LINES.length) show(); else finish();
    });
    skip.addEventListener('click', finish);
    wt.addEventListener('keydown', function(e){
      if(e.key === 'Escape') finish();
      if(e.key === 'Tab'){ /* trap: only two controls */
        var f = [next, skip];
        var idx = f.indexOf(document.activeElement);
        e.preventDefault();
        f[(idx + (e.shiftKey ? f.length-1 : 1)) % f.length].focus();
      }
    });
  }

  /* ---------- boot ---------- */
  function start(){
    if(!SESSIONS || !SEC_META[secKey]){ askSection(); return; }
    PLAN = buildPlan();
    render();
    postHeight();
  }

  function boot(){
    if(!SESSIONS || !LINKS){
      document.getElementById('hl-kicker').textContent = 'Cannot load';
      document.getElementById('hl-title').textContent = 'The schedule did not load';
      document.getElementById('hl-body').innerHTML =
        'This page needs schedule-fall2026.js and session-links.js beside it. ' +
        'Use the <a href="bio004-course-calendar.html" target="_top">course calendar</a> in the meantime.';
      return;
    }
    if(!SEC_META[secKey]){ askSection(); return; }
    if(!ls(STORE_WT)){ runWalkthrough(start); }
    else { start(); }
  }

  /* ---------- Canvas height-sender ----------
     Posts every message shape already in use in this repo, so it
     resizes whatever listener the Canvas shell happens to run. */
  var FRAME_ID = (new URLSearchParams(window.location.search)).get('id') || 'bio004-today';
  function postHeight(){
    var h = Math.max(
      document.body.scrollHeight, document.documentElement.scrollHeight,
      document.body.offsetHeight, document.documentElement.offsetHeight
    );
    try{
      parent.postMessage({ frameId:FRAME_ID, id:FRAME_ID, type:'resize', height:h }, '*');
      parent.postMessage({ type:'iframeHeight', id:FRAME_ID, height:h }, '*');
      parent.postMessage({ type:'mcas-embed-height', id:FRAME_ID, height:h }, '*');
    }catch(e){}
  }
  window.addEventListener('load', postHeight);
  window.addEventListener('resize', postHeight);
  if(window.ResizeObserver){
    new ResizeObserver(postHeight).observe(document.body);
  }

  boot();
})();
</script>
