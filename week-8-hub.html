<style>html,body{margin:0;background:#08101F;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}main{padding:40px 20px}a{color:#E3C27D;font-weight:700}</style>
<script>
/* Week 8 lives in the weekly schedule now (one source for every week),
   so this page and the schedule can never disagree. Keeps ?sec= and
   breaks out of a Canvas or Kajabi frame so the page is never nested. */
(function () {
  var q = location.search.replace(/^\?/, '');
  q = q.replace(/(^|&)hub=\d+/g, '').replace(/^&/, '');
  var url = 'bio004-weekly-schedule.html?hub=8' + (q ? '&' + q : '') + location.hash;
  try {
    if (window.top === window.self) location.replace(url);
    else window.top.location.replace(new URL(url, location.href).href);
  } catch (e) { location.replace(url); }
})();
</script>
</head>
<body>
<main><p>Opening week 8. <a href="bio004-weekly-schedule.html?hub=8" target="_top">Open it here</a> if nothing happens.</p></main>
