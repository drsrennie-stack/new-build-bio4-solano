<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 138 1180 642" role="img" aria-labelledby="msTitleL msDescL" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<title id="msTitleL">Labeled diagram of a compound light microscope</title>
<desc id="msDescL">Side view of a compound light microscope. Fourteen parts are identified with leader lines: ocular lenses, body tube, revolving nosepiece, objective lenses, stage clips, mechanical stage, condenser, iris diaphragm, illuminator, arm, coarse focus knob, fine focus knob, light intensity control, and base. A dashed gold line traces the light path from the illuminator up through the condenser, the specimen, the objective lens, and the body tube to the ocular lens.</desc>
