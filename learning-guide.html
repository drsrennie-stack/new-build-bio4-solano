/* THE LEARNING GUIDE: every course resource on one page. This is the
   page to link from each class's Canvas home page, with that class at
   the end of the link:
     learning-guide.html?sec=mw      Mon / Wed
     learning-guide.html?sec=tr-am   Tue / Thu morning

   Every course page has a "Learning Guide" button back to here.

<script src="bio004-announcements.js"></script>
<script src="bio004-launchpad-overlay.js"></script>
<script src="bio004-dock.js"></script>
<script>
  /* iframe height sender, so Canvas or Kajabi can size the frame */
  (function () {
    var id = 'bio004-learning-guide';
    function send() {
      var h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
      try { parent.postMessage({ type: 'resize', id: id, frameId: id, height: h }, '*'); } catch (e) {}
    }
    window.addEventListener('load', send);
    window.addEventListener('resize', send);
    if (window.ResizeObserver) new ResizeObserver(send).observe(document.body);
  })();
</script>
</body>
