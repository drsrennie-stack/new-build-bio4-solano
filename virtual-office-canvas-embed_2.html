<!-- ============================================================
     BIO 004 Human Anatomy, Fall 2026
     virtual-office-canvas-embed.html

     THE BLOCK TO PASTE INTO YOUR CANVAS DISCUSSION.

     This file is not a page. It is the HTML to paste, kept in the repo
     so there is one copy of it rather than one per person who needs it.

     ------------------------------------------------------------
     HOW TO PASTE IT, six clicks
     ------------------------------------------------------------
     1. Open the discussion you want this on, the one where students
        will be posting.
     2. Click Edit.
     3. In the toolbar under the message box, find the </> button at
        the bottom right. Click it. The box turns into raw HTML.
     4. Select everything between the BEGIN and END lines below,
        copy it, and paste it into that box.
        If the box already has your own intro text in it, paste this
        underneath rather than over the top.
     5. Click the </> button again to switch back if you want to see
        it rendered. It will look like a blank space in the editor;
        Canvas does not preview iframes. That is normal.
     6. Save.

     ------------------------------------------------------------
     WHY THERE ARE NO BUTTONS IN THE EMBED
     ------------------------------------------------------------
     The URL below ends in ?embed=1. That switch tells the page it is
     living inside the discussion, and it takes off:

       - the Open the Virtual Office and Read the board buttons,
         which would point at the page the student is already on
       - the Start a new question button, which would send them away
         from the reply box six inches below
       - the course tools dock and the footer link columns, which
         belong on the site and not inside a Canvas page

     What is left is the instructions and the examples, ending on a
     line that says the reply box is below. Nothing to click, nothing
     to get lost in. The same file with no ?embed=1 is the full
     standalone page at virtual-office.html, which keeps its buttons
     and its dock. One file, two behaviours, so there is nothing to
     keep in sync.

     The page also detects being in a frame on its own, so if the
     parameter ever gets lost the embed still behaves.

     ------------------------------------------------------------
     WHY THE HEIGHT IS HARD-CODED
     ------------------------------------------------------------
     Canvas strips <script> out of page HTML, so the height-sender
     built into the page cannot be received and the frame cannot size
     itself. Measured in a real browser in embed mode: 6,765px at a
     980px column, 7,005px at 720px, 8,796px at 500px, 10,941px at
     400px. Set to 11,400 so the narrowest phone still fits.

     Extra height on a wide screen costs a little blank space at the
     foot of the frame. Too little height cuts the page off, which is
     worse, so it errs long.

     ------------------------------------------------------------
     KEEP THE TITLE ATTRIBUTE
     ------------------------------------------------------------
     An iframe with no accessible name is a WCAG 4.1.2 failure. A
     screen reader announces "frame" and nothing else.
     ============================================================ -->


<!-- ===== BEGIN, copy from here ===== -->
<p>
  <iframe
    src="https://drsrennie-stack.github.io/new-build-bio4-solano/virtual-office.html?embed=1"
    title="The Virtual Office: how to use this discussion board"
    width="100%"
    height="11400"
    style="width:100%;min-height:11400px;border:0;display:block;"
    loading="lazy"
    scrolling="no"
    allowfullscreen></iframe>
</p>
<p>
  <a href="https://drsrennie-stack.github.io/new-build-bio4-solano/virtual-office.html"
     target="_blank" rel="noopener">Open these instructions in their own tab</a>
  if the box above does not load.
</p>
<!-- ===== END, copy to here ===== -->
