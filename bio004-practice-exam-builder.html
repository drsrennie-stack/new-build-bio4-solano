<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice exam &middot; BIO 004 Human Anatomy</title>
<link rel="canonical" href="https://drsrennie-stack.github.io/new-build-bio4-solano/practice-lecture-exam.html">
<!-- The Practice Exam Builder was merged into practice-lecture-exam.html,
     which now has the builder's choices (what it covers, how hard, the
     prediction and the real score log) on the real exam format and the
     audited card bank. This page only forwards, keeping the query string
     (frameId, sec, exam, mix) and any hash. It stays inside a frame on
     purpose: the practice exam sends its own height to the frame. -->
<script>
  (function () {
    var url = 'practice-lecture-exam.html';
    try { url += location.search + location.hash; } catch (e) {}
    try { location.replace(url); } catch (e) {}
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=practice-lecture-exam.html"></noscript>
<style>
  body{margin:0;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
       background:#FAFAF9;color:#08101F;display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box;}
  .box{max-width:46ch;text-align:center;}
  h1{font-size:1.3rem;font-weight:800;margin:0 0 12px;letter-spacing:-.01em;}
  p{margin:0 0 18px;line-height:1.6;}
  a{color:#6B1616;font-weight:700;}
  a:focus-visible{outline:3px solid #6B1616;outline-offset:3px;border-radius:4px;}
</style>
</head>
<body>
  <main class="box">
    <h1>Practice exam</h1>
    <p>The exam builder is now part of the practice exam. You still pick what it covers and how hard it is, and it now uses the real exam format. Taking you there now.</p>
    <p><a id="go" href="practice-lecture-exam.html" target="_top">Open the practice exam</a></p>
  </main>
  <script>
    (function () {
      try { document.getElementById('go').setAttribute('href', 'practice-lecture-exam.html' + location.search + location.hash); } catch (e) {}
    })();
  </script>
  <script>
    /* iframe height sender, kept under the builder's old frame id in case the forward is blocked */
    (function () {
      'use strict';
      var FRAME_ID = 'bio004-practice-exam-builder';
      function sendHeight() {
        var h = document.body.scrollHeight;
        if (window.parent && window.parent !== window) {
          try { parent.postMessage({type: 'resize', id: FRAME_ID, frameId: FRAME_ID, height: h}, '*'); } catch (e) {}
        }
      }
      window.addEventListener('load', sendHeight);
      window.addEventListener('resize', sendHeight);
    })();
  </script>
</body>
</html>
