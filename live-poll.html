<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Poll &middot; BIO 004 Human Anatomy</title>
<meta name="description" content="The student side of the BIO 004 live poll. Answer on your phone. No names are stored.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#08101F; --navy-tint:#ECEFF4; --terra:#8B1D1D; --terra-deep:#6B1616;
  --gold:#DCB45C; --offwhite:#FAFAF9; --white:#FFFFFF; --gray:#4B5260; --gray-light:#D1D5DB;
  --font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--offwhite);color:var(--navy);font-size:16px;line-height:1.55}
.skip{position:absolute;left:-9999px;top:0;background:var(--navy);color:var(--white);padding:12px 18px;z-index:200;font-weight:600}
.skip:focus{left:0}
.phead{background:var(--navy);color:var(--white);padding:22px 0 20px;margin-bottom:22px}
.phead .wrap{max-width:640px;margin:0 auto;padding:0 18px}
.phead .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold);margin:0 0 8px}
.phead h1{font-size:22px;font-weight:800;margin:0 0 4px;line-height:1.2}
.phead p{margin:0;color:#C7D0DC;font-size:14px}
main{max-width:640px;margin:0 auto;padding:0 18px 56px}
main.setup{max-width:760px;padding:0 20px 64px}
.pq{font-size:20px;font-weight:800;line-height:1.28;margin:0 0 18px}
.pcard{background:var(--white);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin:0 0 16px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{
  display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;
  font-family:var(--font);font-size:16px;line-height:1.4;font-weight:500;
  background:var(--offwhite);color:var(--navy);border:0;border-radius:10px;
  padding:16px;cursor:pointer;min-height:56px;transition:background 160ms ease
}
.choice:hover{background:var(--navy-tint)}
.choice:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.choice .ltr{
  flex:0 0 auto;width:28px;height:28px;border-radius:8px;background:var(--white);color:var(--navy);
  font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;
  box-shadow:inset 0 0 0 1px var(--gray-light)
}
.choice[aria-pressed=true]{background:var(--navy);color:var(--white)}
.choice[aria-pressed=true] .ltr{background:var(--gold);color:var(--navy);box-shadow:none}
.pstat{margin:0;padding:13px 15px;border-radius:8px;background:var(--navy-tint);font-weight:600}
.pmuted{color:var(--gray);margin:0}
h2.sh{font-size:19px;font-weight:700;color:var(--terra);margin:28px 0 8px}
.setup code{background:var(--navy-tint);padding:2px 6px;border-radius:5px;font-size:14px;font-weight:600}
.setup ol{padding-left:22px}
.setup li{margin:0 0 10px}
label.fl{display:block;font-weight:700;margin:0 0 6px}
input[type=text]{
  font-family:var(--font);font-size:16px;padding:12px;border-radius:8px;border:1px solid var(--gray);
  width:100%;max-width:420px;color:var(--navy);background:var(--white)
}
input:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.btn{font-family:var(--font);font-size:15px;font-weight:700;cursor:pointer;background:var(--terra);
  color:var(--white);border:0;border-radius:8px;padding:13px 24px;min-height:46px}
.btn:hover{background:var(--terra-deep)}
.btn:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<a class="skip" href="#main">Skip to the content</a>

<header class="phead">
  <div class="wrap">
    <p class="eyebrow">BIO 004 &middot; Human Anatomy &middot; Solano College</p>
    <h1 id="ph-title">Live Poll</h1>
    <p id="ph-sub">Answer on your phone. Nothing you send here has your name on it.</p>
  </div>
</header>

<main id="main" tabindex="-1"></main>

<script>
/* Same /exec URL as the deck. Setup steps are in live-poll-setup.md. */
window.BIO004_POLL_CONFIG = {
  endpoint: '',          /* paste your .../exec URL between the quotes */
  room: 'BIO4',
  classSize: 32,
  studentPage: 'live-poll.html'
};
</script>
<script src="bio004-lookalikes-data.js"></script>
<script src="bio004-live-poll.js"></script>
<script>
/* ============================================================
   The student side. The presenter lives in
   slides-histology-look-alikes.html, which is the deck you
   project. There is deliberately no second presenter here, so
   there is only one place the presenting behaviour exists.

   Three faces, chosen by the URL:
     live-poll.html                no endpoint set  -> setup help
     live-poll.html                endpoint set     -> enter a code
     live-poll.html?room=BIO4                       -> answer
   ============================================================ */
(function(){
  'use strict';
  var L = window.BIO004_LOOKALIKES;
  var P = window.BIO004Poll;
  var main = document.getElementById('main');
  var params = new URLSearchParams(window.location.search);

  function el(t,c,x){ var n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n; }
  function base(){ return window.location.href.split('?')[0]; }
  function title(t,s){
    document.getElementById('ph-title').textContent = t;
    document.getElementById('ph-sub').textContent = s;
  }

  if(!L || !P){
    main.className = 'setup';
    main.appendChild(el('h2','sh','A file did not load'));
    main.appendChild(el('p', null,
      'This page needs bio004-lookalikes-data.js and bio004-live-poll.js beside it in the repo.'));
    return;
  }

  /* ---------- setup face ---------- */
  if(!P.endpoint){
    document.title = 'Set up the live poll · BIO 004';
    title('The poll is not connected yet', 'This page needs the address of your Apps Script web app.');
    main.className = 'setup';
    main.appendChild(el('p', null,
      'Nothing is broken. The page just has nowhere to send answers to yet, because the endpoint at the top of its script is still empty.'));
    main.appendChild(el('h2','sh','What to do'));
    var ol = document.createElement('ol');
    ['Open script.google.com, make a new project, and paste in bio004-live-poll.gs.',
     'Change PRESENTER_KEY at the top to anything you like, then Save.',
     'Run setup() once and approve the permission prompt. It logs a link to the new spreadsheet, which is where answers land.',
     'Deploy, New deployment, Web app. Execute as Me. Who has access, Anyone. Copy the /exec URL.',
     'Paste that URL into the endpoint on this page AND on slides-histology-look-alikes.html, then push both.'
    ].forEach(function(t){ var li=document.createElement('li'); li.textContent=t; ol.appendChild(li); });
    main.appendChild(ol);

    main.appendChild(el('h2','sh','Test it without editing anything'));
    var lab = el('label','fl','Your web app /exec URL'); lab.setAttribute('for','ep');
    var inp = document.createElement('input'); inp.type='text'; inp.id='ep';
    inp.placeholder='https://script.google.com/macros/s/..../exec';
    var go = el('button','btn','Test the connection'); go.type='button';
    var out = el('p','pstat','Not tested yet.');
    out.setAttribute('role','status'); out.setAttribute('aria-live','polite');
    go.addEventListener('click', function(){
      var v = inp.value.trim();
      if(!v){ out.textContent = 'Paste the URL first.'; inp.focus(); return; }
      P.setEndpoint(v);
      out.textContent = 'Trying...';
      P.call({ action:'ping', room:P.room }).then(function(r){
        out.textContent = (r && r.ok)
          ? 'It answered. Paste this URL into both pages and you are done.'
          : 'It answered but reported a problem: ' + ((r && r.error) || 'unknown');
      }).catch(function(){
        out.textContent = 'No answer. Check that Who has access is set to Anyone, and that you copied the /exec URL rather than the /dev one.';
      });
    });
    main.appendChild(lab); main.appendChild(inp);
    var row = el('p'); row.style.marginTop='14px'; row.appendChild(go);
    main.appendChild(row); main.appendChild(out);
    return;
  }

  /* ---------- join face ---------- */
  if(!params.get('room')){
    title('Join the poll', 'Type the room code from the screen at the front.');
    var card = el('div','pcard');
    var l2 = el('label','fl','Room code'); l2.setAttribute('for','joincode');
    var ci = document.createElement('input');
    ci.type='text'; ci.id='joincode'; ci.value = P.room;
    ci.setAttribute('autocomplete','off');
    ci.setAttribute('autocapitalize','characters');
    ci.setAttribute('maxlength','6');
    var jb = el('button','btn','Join'); jb.type='button';
    function join(){
      var v = ci.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
      if(!v){ ci.focus(); return; }
      window.location.href = base() + '?room=' + v;
    }
    jb.addEventListener('click', join);
    ci.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); join(); } });
    card.appendChild(l2); card.appendChild(ci);
    var r2 = el('p'); r2.style.marginTop='14px'; r2.appendChild(jb);
    card.appendChild(r2);
    main.appendChild(card);
    main.appendChild(el('p','pmuted','No names are stored. Only which option was tapped.'));
    ci.focus(); ci.select();
    return;
  }

  /* ---------- answering face ----------
     Every question the deck could put up, so the phone follows the
     projector without the student doing anything. */
  title('Live Poll', 'Room ' + P.room + '. Nothing you send here has your name on it.');
  P.student(main, L.allPollQuestions());
})();
</script>
</body>
</html>
