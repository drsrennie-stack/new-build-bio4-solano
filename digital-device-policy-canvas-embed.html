<!-- ============================================================
     BIO 004 Human Anatomy, Fall 2026
     digital-device-policy-canvas-embed.html

     THE BLOCK TO PASTE INTO THE CANVAS DEVICE POLICY ASSIGNMENT.

     This file is not a page. It is the HTML to paste, kept in the repo
     so there is one copy of it rather than one per person who needs it.

     Target assignment:
     https://solano.instructure.com/courses/1395734/assignments/6734628

     ------------------------------------------------------------
     HOW TO PASTE IT, six clicks
     ------------------------------------------------------------
     1. Open the assignment above.
     2. Click Edit.
     3. In the toolbar under the description box, find the </> button at
        the bottom right. Click it. The box turns into raw HTML.
     4. Select everything between the BEGIN and END lines below, copy
        it, and paste it into that box.
        If the box already has your own instructions in it, paste this
        underneath rather than over the top.
     5. Click the </> button again to switch back if you want to see it
        rendered. It will look like a blank space in the editor; Canvas
        does not preview iframes. That is normal.
     6. Save.

     ------------------------------------------------------------
     WHAT THE EMBED SHOWS, AND WHAT IT DOES NOT
     ------------------------------------------------------------
     The URL below ends in ?embed=1. That switch tells the policy page
     it is living inside the assignment, and it takes off:

       - the course tools dock and the footer link columns
       - the hero buttons back to the syllabus and to course home
       - step 2, Submit it in Canvas, which points at the assignment
         the student is already standing on
       - step 3, Back to Today

     What is left is why the policy exists, the rules in plain terms,
     the under-18 rule, and step 1: the agreement itself.

     ------------------------------------------------------------
     WHY STEP 1 STILL OPENS A NEW TAB
     ------------------------------------------------------------
     The agreement is filled in and then saved as a PDF. Printing or
     saving the contents of an iframe is unreliable in every browser and
     close to impossible on a phone, so the agreement is NOT embedded.
     Inside the frame that button switches from target="_top" to
     target="_blank" on its own, because _top would throw Canvas out of
     its own frame. The student fills it in there, saves the PDF, comes
     back to this page, and uploads it in the submission box.

     ------------------------------------------------------------
     WHY THE HEIGHT IS HARD-CODED
     ------------------------------------------------------------
     Canvas strips <script> out of page HTML, so the height-sender built
     into the page cannot be received and the frame cannot size itself.
     Measured in a real browser in embed mode: 3,094px at a 980px
     column, 3,015px at 720px, 3,621px at 500px, 4,274px at 400px,
     4,628px at 360px. Set to 4,900 so the narrowest phone still fits.

     Extra height on a wide screen costs a little blank space at the
     foot of the frame. Too little height cuts the page off, which is
     worse, so it errs long.

     ------------------------------------------------------------
     KEEP THE TITLE ATTRIBUTE
     ------------------------------------------------------------
     An iframe with no accessible name is a WCAG 4.1.2 failure. A
     screen reader announces "frame" and nothing else.
     ============================================================ -->

<p>

    src="https://drsrennie-stack.github.io/new-build-bio4-solano/digital-device-policy.html?embed=1"

    scrolling="no"
    allowfullscreen></iframe>
</p>
