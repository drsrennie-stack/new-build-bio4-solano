  <script>
    /* Opened as its own page: go straight there. Inside a Canvas or Kajabi frame: take the whole
       window there, and if the browser blocks that, stay put and let the button do it. Never load
       the tool inside the frame, where its saves would not reach Mastery OS. */
    (function () {
      var url = 'mastery-os-fall-2026.html#s-recall';
      if (window.top === window.self) { location.replace(url); return; }
      try { window.top.location.replace(new URL(url, location.href).href); } catch (e) {}
    })();
  </script>
  <script>
    (function () {
      var id = 'bio004-recall-redirect';
      function send() {
        var h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
        try { parent.postMessage({ id: id, height: h }, '*'); } catch (e) {}
      }
      window.addEventListener('load', send);
      window.addEventListener('resize', send);
      if (window.ResizeObserver) new ResizeObserver(send).observe(document.body);
    })();
  </script>
</body>
